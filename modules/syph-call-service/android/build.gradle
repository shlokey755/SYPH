plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.syphcallservice'
version = '1.0.0'

android {
  namespace "expo.modules.syphcallservice"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // SyphMessagingService extends expo-notifications' push service, so it needs that module and the Firebase library its
  // signature uses. Same version as expo-notifications declares (node_modules/expo-notifications/android/build.gradle).
  implementation project(':expo-notifications')
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
